info:
  name: USER-RESET-PASSWORD-004 — Missing Password
  type: http
  seq: 4
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users/:id/password-reset"
  params:
    - name: id
      value: "{{testUserId}}"
      type: path
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const responseText = JSON.stringify(res.body);

        test("HTTP status is 400", function () {
            expect(res.status).to.eql(400);
        });

        test("Success flag is false", function () {
            expect(res.body.success).to.eql(false);
        });

        test("Notification indicates an exception", function () {
            expect(res.body.notification.exception).to.eql(true);
        });

        test("Validation message is present", function () {
            expect(res.body.notification.exceptionMessage).to.be.a("string").and.not.empty;
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).not.to.match(
                /stackTrace|at\s+[\w.$]+\(|org\.springframework|org\.apache\.catalina/i
            );
        });

        test("Response does not expose sensitive credentials", function () {
            expect(responseText).not.to.match(
                /"(password|access_token|refresh_token|authorization)"\s*:/i
            );
        });

        test("Response status code matches HTTP status", function () {
            expect(res.body.statusCode).to.eql(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
