info:
  name: USER-RESET-PASSWORD-001 — Reset User Password Successfully
  type: http
  seq: 1
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users/:id/password-reset"
  params:
    - name: id
      value: "{{testUserId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "password": "Password@234"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const responseText = JSON.stringify(res.body);

        test("HTTP status is 200", function () {
            expect(res.status).to.eql(200);
        });

        test("Success flag is true", function () {
            expect(res.body.success).to.eql(true);
        });

        test("Notification indicates no exception", function () {
            expect(res.body.notification.exception).to.eql(false);
        });

        test("Success message is correct", function () {
            expect(res.body.notification.exceptionMessage)
                .to.eql("Password reset successfully");
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).not.to.match(
                /stackTrace|at\s+[\w.$]+\(|org\.springframework|org\.apache\.catalina/i
            );
        });

        test("Response does not expose sensitive credentials", function () {
            expect(responseText).not.to.match(
                /"(password|access_token|refresh_token|authorization)"\s*:/i
            );
        });

        test("Response status code matches HTTP status", function () {
            expect(res.body.statusCode).to.eql(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
