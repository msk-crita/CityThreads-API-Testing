info:
  name: USER-CREATE-001 — Create User Successfully
  type: http
  seq: 1
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users"
  body:
    type: json
    data: |-
      {
        "username": "{{testUsername}}",
        "email": "{{testEmail}}",
        "phone": "{{testPhone}}",
        "password": "{{testPassword}}",
        "status": "{{testStatus}}",
        "first_name": "{{testFirstName}}",
        "last_name": "{{testLastName}}",
        "job_title": "{{testJobTitle}}",
        "role_id": {{testRoleId}}
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Get the previous counter from the active environment
        let counter = Number(bru.getEnvVar("testUserCounter") || 0);

        // Increment for every request execution
        counter++;

        // Save the updated counter
        bru.setEnvVar("testUserCounter", String(counter));

        // Generate username and email with 3-digit numbering
        const uniqueId = String(counter).padStart(3, "0");

        bru.setVar("testUsername", `bruno.test.user${uniqueId}`);
        bru.setVar("testEmail", `bruno.test.user${uniqueId}@example.com`);

        // Set remaining test data
        bru.setVar("testPhone", "9876543210");
        bru.setVar("testPassword", "Password@123");
        bru.setVar("testStatus", "active");
        bru.setVar("testFirstName", "Bruno");
        bru.setVar("testLastName", "Test");
        bru.setVar("testJobTitle", "QA Engineer");
        bru.setVar("testRoleId", "2");

        console.log("Create User test data prepared");
        console.log("Username:", bru.getVar("testUsername"));
        console.log("Email:", bru.getVar("testEmail"));
    - type: tests
      code: |-
        const body = res.body;
        const data = body?.data;
        const responseText = JSON.stringify(body);

        test("Status code is 200 or 201", function () {
            expect([200, 201]).to.include(res.status);
        });

        test("Response indicates success", function () {
            expect(body.success).to.equal(true);
            expect(body.notification?.exception).to.equal(false);
        });

        test("Created user data is returned correctly", function () {
            expect(data).to.be.an("object");
            expect(data).to.have.property("id");
            expect(data).to.have.property("username", bru.getVar("testUsername"));
            expect(data).to.have.property("email", bru.getVar("testEmail"));
            expect(data).to.have.property("status", bru.getVar("testStatus"));
            expect(data).to.have.property("role_id", Number(bru.getVar("testRoleId")));
        });

        test("Sensitive information is not exposed", function () {
            expect(data).to.not.have.property("password");
            expect(responseText).to.not.match(/Test@12345/);
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).to.not.match(/stacktrace|stack trace|at\s+[\w.$]+\(/i);
        });

        test("Response statusCode matches HTTP status", function () {
            expect(body.statusCode).to.equal(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
