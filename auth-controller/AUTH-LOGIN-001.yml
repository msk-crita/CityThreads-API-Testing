info:
  name: AUTH-LOGIN-001
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseuUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "{{login}}",
        "password": "{{password}}",
        "client_type": "browser",
        "device_label": "e2e"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const login = bru.getEnvVar("login");
        const password = bru.getEnvVar("password");

        if (!login || !password) {
            throw new Error("Login credentials are missing from the environment");
        }

        console.log("Executing valid login scenario");
    - type: after-response
      code: |-
        if (
            res.body.success === true &&
            res.body.data &&
            res.body.data.access_token
        ) {
            bru.setVar("accessToken", res.body.data.access_token);

            console.log("Access token captured successfully");

            if (res.body.data.refresh_token) {
                bru.setVar("refreshToken", res.body.data.refresh_token);
                console.log("Refresh token captured successfully");
            } else {
                console.log("No refresh token returned by Login");
            }
        }
    - type: tests
      code: |-
        // AUTH-LOGIN-001: HTTP status validation
        test("AUTH-LOGIN-001: Status code is 200", function () {
            expect(res.status).to.equal(200);
        });

        // AUTH-LOGIN-001: Response structure
        test("AUTH-LOGIN-001: Response has valid structure", function () {
            expect(res.body).to.be.an("object");

            expect(res.body).to.have.property("success");
            expect(res.body).to.have.property("notification");
            expect(res.body).to.have.property("data");
        });

        // AUTH-LOGIN-001: Login success
        test("AUTH-LOGIN-001: Login is successful", function () {
            expect(res.body.success).to.equal(true);

            expect(res.body.notification.exception).to.equal(false);

            expect(res.body.data.status).to.equal("AUTHENTICATED");
        });

        // AUTH-LOGIN-001: Access token validation
        test("AUTH-LOGIN-001: Access token is present", function () {
            expect(res.body.data.access_token).to.be.a("string").and.not.empty;
        });

        // AUTH-LOGIN-001: Token type validation
        test("AUTH-LOGIN-001: Token type is Bearer", function () {
            expect(res.body.data.token_type).to.equal("Bearer");
        });

        // AUTH-LOGIN-001: Token expiry validation
        test("AUTH-LOGIN-001: Token expiry is valid", function () {
            expect(res.body.data.expires_in).to.be.a("number").and.above(0);
        });

        // AUTH-LOGIN-001: Role validation
        test("AUTH-LOGIN-001: Role code is present", function () {
            expect(res.body.data.role_code).to.be.a("string").and.not.empty;
        });

        // AUTH-LOGIN-001: Refresh token validation
        test("AUTH-LOGIN-001: Refresh token field is present", function () {
            expect(res.body.data).to.have.property("refresh_token");
        });

        // AUTH-LOGIN-001: Challenge token validation
        test("AUTH-LOGIN-001: Challenge token field is present", function () {
            expect(res.body.data).to.have.property("challenge_token");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
