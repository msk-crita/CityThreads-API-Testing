info:
  name: AUTH-LOGIN-010 -- Wrong Client Type
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "{{login}}",
        "password": "{{password}}",
        "client_type": "bruno",
        "device_label": "e2e"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("AUTH-LOGIN-010: Wrong client type is rejected", function () {
            expect(res.status).to.equal(400);
            expect(res.body).to.be.an("object");
            expect(res.body.success).to.equal(false);
        });

        test("AUTH-LOGIN-010: Client type validation error is returned", function () {
            expect(res.body.notification).to.be.an("object");
            expect(res.body.notification.exception).to.equal(true);
            expect(res.body.notification.exceptionSeverity).to.equal("MEDIUM");
            expect(res.body.notification.exceptionMessage).to.equal(
                "Client type is not supported."
            );
        });

        test("AUTH-LOGIN-010: Error response does not expose stack trace", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /stacktrace|stack trace|at\s+[\w.$]+\s*\(|Caused by:|Exception in thread/gi
            );
        });

        test("AUTH-LOGIN-010: Error response does not expose internal implementation details", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /com\.crita\.|org\.springframework\.|java\.base\/|org\.apache\.catalina/gi
            );
        });

        test("AUTH-LOGIN-010: Error response does not expose sensitive credentials or tokens", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /password|access_token|refresh_token|challenge_token/gi
            );
        });

        test("AUTH-LOGIN-010: Error response contains valid HTTP status code", function () {
            expect(res.body.statusCode).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
