info:
  name: AUTH-LOGIN-003 — Invalid Username
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "invalid.user",
        "password": "{{password}}",
        "client_type": "browser",
        "device_label": "DELL"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // AUTH-LOGIN-002: HTTP status validation
        test("AUTH-LOGIN-003: Returns 401 Unauthorized", function () {
            expect(res.status).to.equal(401);
        });

        // AUTH-LOGIN-002: Response structure
        test("AUTH-LOGIN-003: Response has valid error structure", function () {
            expect(res.body).to.be.an("object");

            expect(res.body).to.have.property("notification");

            expect(res.body).to.have.property("success");

            expect(res.body).to.have.property("statusCode");
        });

        // AUTH-LOGIN-002: Authentication failure
        test("AUTH-LOGIN-003: Login is rejected", function () {
            expect(res.body.success).to.equal(false);

            expect(res.body.statusCode).to.equal(401);

            expect(res.body.notification.exception).to.equal(true);
        });

        // AUTH-LOGIN-002: Error message validation
        test("AUTH-LOGIN-003: Invalid credentials message is returned", function () {
            expect(res.body.notification.exceptionMessage)
                .to.equal("Invalid username or password.");
        });

        // AUTH-LOGIN-002: Exception severity
        test("AUTH-LOGIN-003: Exception severity is HIGH", function () {
            expect(res.body.notification.exceptionSeverity).to.equal("HIGH");
        });

        // AUTH-LOGIN-002: No authentication data returned
        test("AUTH-LOGIN-003: Authentication data is not returned", function () {
            expect(res.body).to.not.have.property("data");
        });


        test("AUTH-LOGIN-003: Response does not contain a stack trace", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /stacktrace|stack trace|at\s+[\w.$]+\s*\(|Caused by:|Exception in thread/gi
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
