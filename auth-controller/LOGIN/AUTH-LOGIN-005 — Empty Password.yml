info:
  name: AUTH-LOGIN-005 — Empty Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "{{login}}",
        "password": "",
        "client_type": "browser",
        "device_label": "DELL"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("AUTH-LOGIN-005: Returns 400 Bad Request", function () {
            expect(res.status).to.equal(400);
        });

        test("AUTH-LOGIN-005: Response has valid error structure", function () {
            expect(res.body).to.be.an("object");
            expect(res.body).to.have.property("notification");
            expect(res.body).to.have.property("success");
            expect(res.body).to.have.property("statusCode");
        });

        test("AUTH-LOGIN-005: Empty password is rejected", function () {
            expect(res.body.success).to.equal(false);
            expect(res.body.statusCode).to.equal(400);
            expect(res.body.notification.exception).to.equal(true);
        });

        test("AUTH-LOGIN-005: Password validation message is returned", function () {
            expect(res.body.notification.exceptionMessage).to.equal("Password must not be blank");
        });

        test("AUTH-LOGIN-005: No authentication data is returned", function () {
            expect(res.body).to.not.have.property("data");
        });

        test("AUTH-LOGIN-005: Response does not contain a stack trace", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /stacktrace|stack trace|at\s+[\w.$]+\s*\(|Caused by:|Exception in thread/gi
            );
        });

        test("AUTH-LOGIN-005: Response does not expose sensitive credentials or tokens", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /password|access_token|refresh_token|challenge_token/gi
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
