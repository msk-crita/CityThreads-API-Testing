info:
  name: AUTH-ME-002 — Missing Authorization Token
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"

runtime:
  scripts:
    - type: tests
      code: |-
        test("AUTH-ME-002: Request without authorization is rejected", function () {
            expect(res.status).to.equal(401);
            expect(res.body).to.be.an("object");
            expect(res.body.success).to.equal(false);
        });

        test("AUTH-ME-002: Authentication failure notification is returned", function () {
            expect(res.body.notification).to.be.an("object");
            expect(res.body.notification.exception).to.equal(true);
        });

        test("AUTH-ME-002: Appropriate authentication error is returned", function () {
            expect(res.body.notification.exceptionMessage).to.match(
                /unauthorized|authentication is required|access token required|missing token/i
            );
        });

        test("AUTH-ME-002: Response does not expose stack trace", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /stacktrace|stack trace|at\s+[\w.$]+\s*\(|Caused by:|Exception in thread/gi
            );
        });

        test("AUTH-ME-002: Response does not expose sensitive credentials or tokens", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /password|access_token|refresh_token|challenge_token/gi
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
