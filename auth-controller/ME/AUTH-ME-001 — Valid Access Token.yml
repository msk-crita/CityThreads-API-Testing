info:
  name: AUTH-ME-001 — Valid Access Token
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("testUserId", String(res.body.data.id));
    - type: tests
      code: |-
        test("AUTH-ME-001: Current user request is successful", function () {
            expect(res.status).to.equal(200);
            expect(res.body).to.be.an("object");
            expect(res.body.success).to.equal(true);
        });

        test("AUTH-ME-001: Success notification is returned", function () {
            expect(res.body.notification).to.be.an("object");
            expect(res.body.notification.exception).to.equal(false);
            expect(res.body.notification.exceptionMessage).to.equal("Current user.");
        });

        test("AUTH-ME-001: User profile contains required fields", function () {
            expect(res.body.data).to.be.an("object");
            expect(res.body.data.id).to.exist;
            expect(res.body.data.username).to.be.a("string").and.not.empty;
            expect(res.body.data.role_name).to.be.a("string").and.not.empty;
            expect(res.body.data.role_code).to.be.a("string").and.not.empty;
            expect(res.body.data.status).to.be.a("string").and.not.empty;
        });

        test("AUTH-ME-001: User sessions are returned as an array", function () {
            expect(res.body.data.sessions).to.be.an("array");
        });

        test("AUTH-ME-001: Response contains valid status code", function () {
            expect(res.body.statusCode).to.equal(200);
        });

        test("AUTH-ME-001: Response contains valid timestamp", function () {
            expect(res.body.responseTime).to.be.a("string");
            expect(Date.parse(res.body.responseTime)).to.not.be.NaN;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
