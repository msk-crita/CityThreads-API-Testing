info:
  name: AUTH-ME-003 — Invalid Access Token
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth:
    type: bearer
    token: invalid.token.value

runtime:
  scripts:
    - type: tests
      code: |-
        test("AUTH-ME-003: Request with invalid token is rejected", function () {
            expect(res.status).to.equal(401);
            expect(res.body).to.be.an("object");
            expect(res.body.success).to.equal(false);
        });

        test("AUTH-ME-003: Authentication error notification is returned", function () {
            expect(res.body.notification).to.be.an("object");
            expect(res.body.notification.exception).to.equal(true);
            expect(res.body.notification.exceptionMessage).to.be.a("string").and.not.empty;
        });

        test("AUTH-ME-003: Error response does not expose stack trace", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /stacktrace|stack trace|at\s+[\w.$]+\s*\(|Caused by:|Exception in thread/gi
            );
        });

        test("AUTH-ME-003: Error response does not expose sensitive credentials or tokens", function () {
            const responseText = JSON.stringify(res.body);

            expect(responseText).to.not.match(
                /password|access_token|refresh_token|challenge_token/gi
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
