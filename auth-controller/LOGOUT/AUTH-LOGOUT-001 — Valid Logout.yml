info:
  name: AUTH-LOGOUT-001 — Valid Logout
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout"
  body:
    type: json
    data: |-
      {
        "refresh_token": ""
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("AUTH-LOGOUT-001: Logout response is successful", function () {
            expect(res.status).to.equal(200);

            expect(res.body).to.be.an("object");

            expect(res.body.success).to.equal(true);
        });

        test("AUTH-LOGOUT-001: Logout notification is successful", function () {
            expect(res.body.notification).to.be.an("object");

            expect(res.body.notification.exception).to.equal(false);

            expect(res.body.notification.exceptionMessage).to.equal("Successfully signed out.");
        });

        test("AUTH-LOGOUT-001: Logout response contains valid status code", function () {
            expect(res.body.statusCode).to.equal(200);
        });

        test("AUTH-LOGOUT-001: Logout response contains response timestamp", function () {
            expect(res.body.responseTime).to.be.a("string");

            expect(res.body.responseTime).to.not.be.empty;

            expect(Date.parse(res.body.responseTime)).to.not.be.NaN;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
