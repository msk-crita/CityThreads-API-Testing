info:
  name: AUTH-LOGOUT-002 — Repeated Logout
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("AUTH-LOGOUT-002: Repeated logout returns an appropriate message", function () {
            expect(res.status).to.equal(200);

            expect(res.body).to.be.an("object");

            expect(res.body.success).to.equal(true);

            expect(res.body.notification.exception).to.equal(false);

            expect(res.body.notification.exceptionMessage).to.match(
                /already logged out|already signed out/i
            );
        });

        test("AUTH-LOGOUT-002: Repeated logout response contains valid status code", function () {
            expect(res.body.statusCode).to.equal(200);
        });

        test("AUTH-LOGOUT-002: Repeated logout response contains valid timestamp", function () {
            expect(res.body.responseTime).to.be.a("string");

            expect(res.body.responseTime).to.not.be.empty;

            expect(Date.parse(res.body.responseTime)).to.not.be.NaN;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
